<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Waseem Mushtaq Mir, Founder of KashRoot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/><stop offset="0.5" stop-color="#065f46"/><stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.12" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="1" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <image id="logo" width="160" height="160" href="data:image/png;base64,"/>
    <clipPath id="r"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>
    <rect width="1280" height="320" fill="url(#glow2)"/>
    <use href="#logo" transform="translate(1020 -40) scale(2)" opacity="0.10"/>
    <use href="#logo" x="72" y="80"/>
    <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#ffffff">
      <text x="268" y="128" font-size="52" font-weight="700" letter-spacing="-1">Waseem Mushtaq Mir</text>
      <text x="270" y="172" font-size="26" font-weight="600" fill="#fde68a">Founder, KashRoot</text>
      <text x="270" y="214" font-size="21" fill="#d1fae5">Building trusted trade, live market prices and logistics</text>
      <text x="270" y="244" font-size="21" fill="#d1fae5">for producers, buyers and small businesses in India.</text>
    </g>
  </g>
</svg>